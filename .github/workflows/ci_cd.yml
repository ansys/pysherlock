name: GitHub CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full-docs:
        description: "Build the documentation with executed gallery examples (uses the self-hosted runner)"
        type: boolean
        default: false
      full-tests:
        description: "Run the tests against every supported Python version"
        type: boolean
        default: false
  push:
    tags:
      - "*"
    branches:
      - main

env:
  MAIN_PYTHON_VERSION: '3.14'
  PACKAGE_NAME: 'ansys-sherlock-core'
  PACKAGE_NAMESPACE: 'ansys.sherlock.core'
  DOCUMENTATION_CNAME: 'sherlock.docs.pyansys.com'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let a release run finish after it recreates its tag instead of canceling it midway.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}


permissions: {}

jobs:
  config:
    name: Compute CI configuration
    runs-on: ubuntu-latest
    outputs:
      full-docs: ${{ steps.eval.outputs.full-docs }}
      changelog-pending: ${{ steps.eval.outputs.changelog-pending }}
      python-versions: ${{ steps.eval.outputs.python-versions }}
    steps:
      - name: Check out the changelog of the release tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            doc/changelog.d
            doc/source/changelog.rst
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Evaluate the workload to run on the self-hosted runner
        id: eval
        shell: bash
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          TAG_NAME: ${{ github.ref_name }}
          FULL_DOCS_REQUESTED: ${{ inputs.full-docs }}
          FULL_TESTS_REQUESTED: ${{ inputs.full-tests }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          # The changelog action adds a CHANGELOG section when fragments are present and
          # the section does not exist yet, then recreates the tag and stops this run.
          # Pre-releases keep their fragments, so the section is what tells the runs apart.
          CHANGELOG_PENDING=false
          if [[ "${IS_TAG}" == "true" ]] \
             && [[ -n "$(find doc/changelog.d -type f -name '*.md' -print -quit)" ]] \
             && ! grep -qF "releases/tag/${TAG_NAME}>" doc/source/changelog.rst; then
            CHANGELOG_PENDING=true
          fi
          echo "changelog-pending=${CHANGELOG_PENDING}" >> "${GITHUB_OUTPUT}"

          # Executed examples are only required for the documentation that gets
          # published on a release. Everything else builds the gallery pages
          # without running the examples, which frees the self-hosted runner.
          # A release run that only updates the CHANGELOG does not publish anything.
          if [[ ( "${IS_TAG}" == "true" && "${CHANGELOG_PENDING}" != "true" ) || "${FULL_DOCS_REQUESTED}" == "true" ]]; then
            echo "full-docs=true" >> "${GITHUB_OUTPUT}"
          else
            echo "full-docs=false" >> "${GITHUB_OUTPUT}"
          fi

          # The self-hosted runner is unique, so matrix entries are serialized.
          # Pull requests only test the main Python version unless asked otherwise.
          if [[ "${IS_PULL_REQUEST}" == "true" && "${FULL_TESTS_REQUESTED}" != "true" ]]; then
            echo "python-versions=[\"${MAIN_PYTHON_VERSION}\"]" >> "${GITHUB_OUTPUT}"
          else
            echo 'python-versions=["3.12", "3.13", "3.14"]' >> "${GITHUB_OUTPUT}"
          fi

  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - name: PyAnsys code style checks
        uses: ansys/actions/code-style@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  docs-style:
    name: Documentation Style Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: PyAnsys documentation style checks
        uses: ansys/actions/doc-style@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          vale-version: "3.4.1"

  smoke-tests:
    name: Build and Smoke tests
    runs-on: ${{ matrix.os }}
    needs: [ style ]
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ '3.12', '3.13', '3.14' ]
        should-release:
          - ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags') }}
        exclude:
          - should-release: false
            os: macos-latest
    steps:
      - name: Build wheelhouse and perform smoke test
        uses: ansys/actions/build-wheelhouse@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          library-namespace: ${{ env.PACKAGE_NAMESPACE }}
          operating-system: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}

  tests:
    name: Tests and coverage
    needs: [ smoke-tests, config ]
    runs-on: [ self-hosted, pysherlock ]
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.python-versions) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create Python venv
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1

      - name: Install packages for testing
        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install --upgrade build wheel
          pip install .[tests]

      - name: Testing
        run: |
          .\.venv\Scripts\Activate.ps1
          pytest -v --cov=ansys.sherlock --cov-report=term --cov-report=html:.cov/html --cov-report=xml:.cov/coverage.xml

      - name: Upload coverage results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.MAIN_PYTHON_VERSION == matrix.python-version
        with:
          name: coverage-results
          path: .cov
          retention-days: 7

      - name: Upload coverage to Codecov
        if: env.MAIN_PYTHON_VERSION == matrix.python-version
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: .cov/coverage.xml

  docs:
    name: Documentation
    needs: [ docs-style, config ]
    # Only builds that execute the gallery examples need Sherlock, and therefore
    # the self-hosted runner. Every other build runs on a GitHub-hosted runner.
    runs-on: ${{ needs.config.outputs.full-docs == 'true' && fromJSON('[ "self-hosted", "pysherlock" ]') || 'windows-latest' }}
    timeout-minutes: 90
    env:
      PYSHERLOCK_BUILD_EXAMPLES: ${{ needs.config.outputs.full-docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure that a release builds the examples
        # The documentation published for a release must contain the output of
        # the examples. This guard makes a misconfiguration fail the release
        # instead of silently publishing a documentation without results.
        if: startsWith(github.ref, 'refs/tags/') && needs.config.outputs.changelog-pending != 'true'
        shell: bash
        run: |
          if [[ "${PYSHERLOCK_BUILD_EXAMPLES}" != "true" ]]; then
            echo "::error::Releasing requires the gallery examples to be executed, but PYSHERLOCK_BUILD_EXAMPLES is '${PYSHERLOCK_BUILD_EXAMPLES}'."
            exit 1
          fi
          if [[ "${RUNNER_ENVIRONMENT}" != "self-hosted" ]]; then
            echo "::error::Executing the gallery examples requires the self-hosted runner where Sherlock is installed."
            exit 1
          fi
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWord -Force
          Write-Host "Windows Long Paths enabled (a runner service restart may be required once)."
      - name: Run documentation building action
        uses: ansys/actions/doc-build@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          checkout: false

      - name: Verify that every release example has generated output
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.config.outputs.changelog-pending != 'true'
        shell: powershell
        env:
          PYSHERLOCK_BUILD_EXAMPLES: 'false'
          PYSHERLOCK_REUSE_GALLERY: 'true'
        run: |
          & .\.venv\Scripts\python.exe -c "import os, runpy; os.chdir('doc/source'); runpy.run_path('conf.py')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package:
    name: Package library
    # On a release tag, update-changelog fails on purpose when it recreates the tag, so only
    # the run started by the recreated tag packages and releases the library.
    if: ${{ !cancelled() && needs.tests.result == 'success' && needs.docs.result == 'success' && (needs.update-changelog.result == 'success' || (needs.update-changelog.result == 'skipped' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))) }}
    needs: [ tests, docs, update-changelog ]
    runs-on: ubuntu-latest
    steps:
      - name: Build library source and wheel artifacts
        uses: ansys/actions/build-library@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  release:
    name: Release project
    if: ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags') }}
    needs: [ package, update-changelog ]
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: release
    permissions:
      id-token: write    # Required for PyPI trusted publisher authentication
      contents: write    # Needed to download release artifacts
    steps:
      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}-artifacts
          path: ${{ env.PACKAGE_NAME }}-artifacts

      - name: "Display structure of downloaded files"
        run: ls -Rla

      - name: "Release to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ${{ env.PACKAGE_NAME }}-artifacts
          skip-existing: false

      - name: "Release to GitHub"
        uses: ansys/actions/release-github@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 #v11.1.5
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag-name: ${{ github.ref_name }}

  pull-request-name:
    if: github.event_name == 'pull_request'
    name: Check the name of the pull-request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read    # Required to read pull-request information
    steps:
      - name: Check pull-request name
        uses: ansys/actions/check-pr-title@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 #v11.1.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload_docs_release:
    name: Upload release documentation
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Required to push stable documentation to gh-pages branch
    needs: [ release ]
    steps:
      - name: Deploy the stable documentation
        uses: ansys/actions/doc-deploy-stable@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  update-changelog:
    name: "Update CHANGELOG (on release)"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [ config, tests, docs ]
    runs-on: ubuntu-latest
    permissions:
      contents: write         # Needed to create changelog entries in repository
      pull-requests: write    # Required to create pull requests for changelog updates
    steps:
      # Do not mutate the release until the tests and the documentation have passed.
      # If the CHANGELOG changes, this job fails on purpose after recreating the tag. The
      # recreated tag starts a second run that finds the CHANGELOG up to date, executes
      # the gallery examples, and releases.
      # The bot token is required because only the bot may delete protected release tags,
      # and so that the tag push and the pull request into main start their own runs.
      - uses: ansys/actions/doc-deploy-changelog@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

      - name: Never release from a run that did not execute the gallery examples
        if: needs.config.outputs.changelog-pending == 'true'
        shell: bash
        run: |
          echo "::error::This run built the documentation without executing the gallery examples, so it must not release."
          exit 1

  check-vulnerabilities:
    name: "Check library vulnerabilities"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ansys/actions/check-vulnerabilities@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          python-package-name: ${{ env.PACKAGE_NAME }}
          dev-mode: ${{ github.ref != 'refs/heads/main' }}

  actions-security:
    name: "Check actions security"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/check-actions-security@f5e1481b9c128197a30d1dc1dfc52b8cd6865555 # v11.1.5
        with:
          generate-summary: true
          token: ${{ secrets.GITHUB_TOKEN }}
          auditing-level: 'high'
          trust-ansys-actions: true
